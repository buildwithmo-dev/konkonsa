services:
  - type: web
    name: konkonsa-api
    runtime: python
    buildCommand: pip install -r api/requirements.txt
    startCommand: cd api && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        value: Konkonsa/1.0
      - key: X_BEARER_TOKEN
        sync: false
      - key: X_SEARCH_QUERY
        value: '("AI" OR startup OR "small business" OR "side hustle") lang:en -is:retweet'
      - key: X_FETCH_MAX_RESULTS
        value: "50"
      - key: X_FETCH_MAX_PAGES
        value: "1"
      - key: CORS_ORIGINS
        sync: false
      - key: REQUIRE_AUTH
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"

  - type: worker
    name: konkonsa-worker
    runtime: python
    buildCommand: pip install -r api/requirements.txt
    startCommand: cd api && alembic upgrade head && python worker.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        value: Konkonsa/1.0
      - key: X_BEARER_TOKEN
        sync: false
      - key: X_SEARCH_QUERY
        value: '("AI" OR startup OR "small business" OR "side hustle") lang:en -is:retweet'
      - key: X_FETCH_MAX_RESULTS
        value: "50"
      - key: X_FETCH_MAX_PAGES
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
