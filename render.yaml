services:
  - type: web
    name: konkonsa-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    preDeployCommand: ./api/release.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        value: Konkonsa/1.0
      - key: CORS_ORIGINS
        sync: false
      - key: REQUIRE_AUTH
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"

  - type: worker
    name: konkonsa-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: alembic upgrade head && python worker.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        value: Konkonsa/1.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
